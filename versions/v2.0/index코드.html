<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT 운동기록</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb;
  --ink:#1b2230; --ink-2:#556070; --ink-3:#8a93a3;
  --line:#e2e5ea; --line-2:#cfd4dc;
  --accent:#1f3a5f; --accent-2:#2f5687; --accent-soft:#e9eef5;
  --warn:#a5492a; --warn-soft:#fbf0ea;
  --ok:#2d6a4f; --ok-soft:#e7f2ec;
  --gold:#9a7b3c;
  --radius:14px; --radius-s:10px;
  --shadow:0 1px 2px rgba(20,30,50,.05),0 2px 8px rgba(20,30,50,.04);
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:58px}
.brand{white-space:nowrap;font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--accent);display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.topbar .spacer{flex:1}
.mode-pill{font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.mode-pill.gas{background:var(--ok-soft);border-color:#cfe5d8;color:var(--ok)}
.save-state{font-size:13px;color:var(--ink-3);min-width:56px;text-align:right;white-space:nowrap}
.save-state.err{color:var(--warn);font-weight:600}

main{max-width:1280px;margin:0 auto;padding:20px 20px 120px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius-s);border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--warn);border-color:#e8c9bc}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-3);display:inline-grid;place-items:center;font-size:18px;line-height:1;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:46px;border:1px solid var(--line-2);border-radius:var(--radius-s);background:var(--surface);padding:10px 12px;font-size:16px;outline:none}
textarea.input{min-height:84px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,58,95,.12)}
.input::placeholder{color:#a8afbb}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}
.section-title h3{font-size:17px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent;white-space:nowrap}
.chip.other{background:#f1efe9;color:#6b5a35}
.chip.none{background:var(--warn-soft);color:var(--warn)}
.chip.note{background:var(--surface-2);color:var(--ink-2);border-color:var(--line);font-weight:500}
button.chip{min-height:30px}

.empty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:14.5px}

/* member list */
.list-head{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.list-head h2{font-size:22px;flex:1;min-width:160px}
.search{max-width:320px}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.member-card{text-align:left;padding:18px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);transition:border-color .15s}
.member-card:hover{border-color:var(--accent)}
.member-card .name{font-size:18px;font-weight:700}
.member-card .meta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2)}
.member-card .purpose{font-size:14px;color:var(--ink-2);min-height:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* member header */
.mhead{position:sticky;top:58px;z-index:20;background:var(--bg);padding:6px 0 0;margin:-6px 0 14px}
.mhead-inner{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px 0}
.mhead-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.mhead-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
.mhead-sub{font-size:13.5px;color:var(--ink-2)}
.mhead-facts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fact{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.fact small{font-size:12px;font-weight:600;color:var(--ink-3)}
.fact.empty-v{font-weight:500;color:var(--ink-3)}
@media (max-width:760px){.mhead{position:static}}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 14px;font-weight:600;font-size:15px;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* session layout */
.sess{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:-110px}
.sess>.entry{padding-bottom:110px}
.ref{position:sticky;top:var(--ref-top,190px);height:calc(100vh - var(--ref-top,190px) - 12px);display:flex;flex-direction:column;gap:12px}
.ref-fixed{flex:0 0 auto;max-height:64%;overflow:auto;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.ref-scroll{flex:1 1 0;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px;overscroll-behavior:contain}
@media (max-width:1200px){.sess{grid-template-columns:300px minmax(0,1fr)}}
@media (max-width:760px){.sess{grid-template-columns:1fr;margin-bottom:0}.sess>.entry{padding-bottom:0}.ref{position:static;height:auto}.ref-fixed,.ref-scroll{max-height:none;overflow:visible}}
.ref .card{padding:14px 16px}
.ref h4{font-size:14px;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.binfo{display:flex;flex-direction:column;gap:5px;padding:8px!important}
.bi{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:5px 10px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.bi b{font-size:11.5px;font-weight:800;color:#000;margin-right:6px;white-space:nowrap}
.bi.c2{border-left-color:#5b7b6a;background:#eef4f0}
.bi.c3{border-left-color:#9a7b3c;background:#f7f2e7}
.bi.warn{border-left-color:#c0392b;background:#fdecea;color:#b0261a;font-weight:700}
.bi.warn b{color:#000}
.bi .none{color:var(--ink-3);font-weight:400}
.evals{font-size:13px;line-height:1.45}
.evals .eh{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:4px}
.evals .er{display:flex;gap:6px;align-items:baseline;padding:2px 0;border-top:1px dashed var(--line)}
.evals .er:first-of-type{border-top:0}
.evals .er .tn{font-weight:700;white-space:nowrap}
.evals .er .lv{flex:none;font-size:11.5px;padding:0 6px}
.evals .er .nt{color:var(--ink-2);word-break:break-word}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600;font-size:13px}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.kv dd.warn{color:var(--warn);font-weight:600}
.recent-item{border-top:1px solid var(--line);padding:10px 0}
.recent-item:first-of-type{border-top:0;padding-top:0}
.recent-item .rh{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:4px}
.recent-item ul{margin:0;padding:0;list-style:none;font-size:13.5px}
.recent-item li{display:flex;gap:8px;padding:1px 0}
.recent-item li .n{flex:none;max-width:52%;color:var(--ink)}
.recent-item li .s{color:var(--ink-2);word-break:break-all}
.rs{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.rs+.rs{margin-top:10px}
.rs-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:700}
.rs-h .v{font-size:13px;font-weight:600;color:#dbe4f0}
.rt{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rt td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.rt tr:first-child td{border-top:0}
.rt tr:nth-child(even) td{background:var(--surface-2)}
.rt td.n{width:38%;font-weight:700;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.rt td.n .k{display:inline-block;min-width:16px;color:var(--ink-3);font-weight:700;font-size:11.5px}
.rt td.n .chip{margin-top:3px;font-size:11px;padding:1px 6px}
.rt .ssw{display:flex;flex-wrap:wrap;gap:4px}
.sp{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:1px 6px;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sp i{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 4px}
.rs .memo-line{margin:0;border-radius:0;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-line{margin-top:6px;font-size:13px;background:#fff8e6;border-radius:8px;padding:6px 9px;color:#6a5521;white-space:pre-wrap}
.hist-card{border:1.5px solid var(--accent)!important}
.hist-table{width:100%;border-collapse:collapse;font-size:13.5px}
.hist-table td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.hist-table tr:first-child td{border-top:0}
.best{display:flex;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.best div{flex:1;min-width:90px;background:var(--surface-2);border-radius:8px;padding:6px 10px}
.best small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.best b{font-size:16px}

.entry{display:flex;flex-direction:column;gap:12px;min-width:0}
.entry-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:14px 16px}
.entry-head .field{width:170px}
.entry-head .field.no{width:96px}
.editing-badge{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:8px;font-weight:600}
.draft-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff8e6;border:1px solid #f0e0b5;border-radius:10px;padding:10px 14px;font-size:14px;color:#6a5521}

.ex{padding:12px 14px 12px;position:relative}
.ex.open{border:2px solid var(--accent);box-shadow:0 0 0 3px rgba(31,58,95,.08)}
#exList{display:flex;flex-direction:column;gap:8px}
.ex-mini{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);box-shadow:var(--shadow)}
.ex-mini:hover{border-color:var(--accent-2)}
.ex-mini .mn{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.ex-mini .mn.none{color:var(--ink-3);font-weight:500}
.ex-mini .ms{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-mini .mv{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.ex-mini .mv b{color:var(--ink)}
.prev-load{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 0 38px;padding:8px 10px;border:1px dashed var(--accent-2);border-radius:10px;background:#f5f8fc;font-size:13.5px}
.prev-load .pv{flex:1;min-width:160px;color:var(--ink-2)}
.prev-load .pv b{color:var(--ink)}
@media (max-width:980px){.prev-load{margin-left:0}.ex-mini .mn{max-width:50%}}
.ex-head{display:grid;grid-template-columns:30px minmax(0,1.6fr) minmax(0,1fr) auto auto 40px;gap:8px;align-items:center}
.ex-idx{width:28px;height:28px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2)}
.ex-name{font-weight:700;font-size:17px}
.ex-vol{font-size:13.5px;color:var(--ink-2);text-align:right;min-width:72px;white-space:nowrap}
.ex-vol b{color:var(--ink);font-size:15px}
.ac-wrap{position:relative;min-width:0}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 10px 28px rgba(20,30,50,.14);max-height:300px;overflow:auto;padding:4px}
.ac button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:15.5px;min-height:44px}
.ac button:hover,.ac button.hl{background:var(--accent-soft)}
.ac .cnt{font-size:12px;color:var(--ink-3);white-space:nowrap}
.ac .grp{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:8px 12px 2px}
.part-picker{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px 38px;padding:10px;background:var(--surface-2);border-radius:10px}
.part-picker .lbl{width:100%;margin-bottom:2px}
.part-picker button{min-height:38px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600}
.part-picker button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.part-picker button.other{border-style:dashed}

.sets{margin:10px 0 0 38px;display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:24px minmax(110px,1.25fr) auto minmax(78px,.8fr) 78px 36px 36px;grid-template-areas:"no w seg cnt vol copy del";gap:8px;align-items:center}
.set-row .no{grid-area:no;font-size:13px;color:var(--ink-3);font-weight:700;text-align:center}
.set-row .wcell{grid-area:w;display:flex;gap:4px;min-width:0}
.set-row .wcell .input{min-width:0}
.set-row .seg{grid-area:seg}
.set-row .cnt{grid-area:cnt;display:flex;gap:4px;min-width:0}
.set-row .cnt .input{min-width:0;text-align:center}
.set-row .vol{grid-area:vol;text-align:right;font-size:14px;line-height:1.2}
.set-row .vol small{display:block;font-size:11.5px;color:var(--ink-3)}
.set-row .vol small.band{color:var(--gold);font-weight:600}
.set-row .copy{grid-area:copy}.set-row .del{grid-area:del}
.band-btn{flex:none;min-width:48px;min-height:46px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;height:46px}
.seg button{border:0;background:var(--surface);padding:0 11px;font-size:14px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--accent);color:#fff}
.timer-btn{flex:none;width:46px;min-height:46px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:700}
.inl-hist{display:none}
@media (max-width:760px){.ex.open .inl-hist{display:block}}
.ih-box{margin:10px 0 0 38px;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.6}
.ih-box b{font-size:12.5px;color:var(--accent);margin-right:8px}
@media (max-width:980px){.ih-box{margin-left:0}}
.ex-foot{display:flex;gap:8px;margin:8px 0 0 38px}
@media (max-width:980px){
  .ex-head{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"i n d" ". m m" ". p v"}
  .ex-head>.ex-idx{grid-area:i}.ex-head>.ac-wrap.name{grid-area:n}.ex-head>.ac-wrap.note{grid-area:m}.ex-head>.partcell{grid-area:p}.ex-head>.ex-vol{grid-area:v}.ex-head>.icon-btn{grid-area:d}
  .sets,.ex-foot,.part-picker{margin-left:0}
  .set-row{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 36px 36px;grid-template-areas:"no w w w w" ". seg cnt copy del" ". vol vol vol vol";row-gap:6px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
  .set-row .vol{text-align:left}
  .set-row .vol small{display:inline;margin-left:6px}
}

.totals{position:sticky;bottom:12px;z-index:15;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:var(--radius);padding:12px 14px 12px 20px;box-shadow:0 8px 24px rgba(20,30,50,.22)}
.totals .t{display:flex;flex-direction:column;line-height:1.2}
.totals .t small{font-size:11.5px;color:#aeb6c4}
.totals .t b{font-size:19px}
.totals .spacer{flex:1}
.totals .btn{border-color:#fff}
.totals .btn.primary{background:#fff;color:var(--ink)}
.totals .btn.ghost{color:#d7dce4}
.totals .btn.ghost:hover{background:rgba(255,255,255,.1)}

/* popovers / modal / toast */
.pop{position:absolute;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 10px 28px rgba(20,30,50,.16);padding:6px;min-width:170px}
.pop button{display:flex;width:100%;justify-content:space-between;gap:14px;border:0;background:none;padding:10px 12px;border-radius:8px;font-size:15px;min-height:42px}
.pop button:hover{background:var(--accent-soft)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:8px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15)}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(20,26,38,.42);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:min(480px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{font-size:18px;margin-bottom:12px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.err{background:var(--warn)}

/* timer */

<script>
/* =========================================================

const NOTE_SUGGEST = ['밴드1','밴드2','밴드3','밴드4','블럭','볼','보수','메디신볼','슬라이더','스미스','케이블','덤벨','바벨','원레그','원암','원핸드','행잉','+스트레칭','+pnf','+흉추','전사','좌측','우측','범위 작게'];
const CATALOG_SRC = {
  '하체':'스쿼트,퍼펙트 스쿼트,행잉 스쿼트,스플릿 스쿼트,사이드 스플릿 스쿼트,불가리안 스플릿 스쿼트,케이블 로우 스쿼트,TRX 스쿼트,고블릿 스쿼트,런지,백 런지,사이드 런지,레그 프레스,레그 익스텐션,레그 컬,힙 브릿지,원레그 힙 브릿지,힙 쓰러스트,힙 어덕션,힙 에이비덕션,크램쉘,카프 레이즈,카프 토 레이즈,데드리프트,루마니안 데드리프트,원레그 데드리프트,원레그 스티프 데드리프트,굿모닝,리버스 노르딕,스텝 다운,원레그 슬라이더,발등 굴곡 운동,발목 굴곡 운동,프론트 레그레이즈,사이드 레그레이즈',
  '등':'케이블 로우,케이블 원암 로우,시티드 로우,벤트오버 로우,원암 덤벨 로우,랫 풀다운,풀다운,풀업,백 익스텐션,슈퍼맨',
  '가슴':'벤치 프레스,인클라인 벤치 프레스,덤벨 프레스,체스트 프레스,벤치 체스트 플라이,케이블 크로스오버,푸쉬업',
  '어깨':'숄더 프레스,오버헤드 프레스,사이드 레터럴 레이즈,프론트 레이즈,리어 델트 플라이,페이스 풀',
  '이두':'케이블 컬,바벨 컬,덤벨 컬,해머 컬',
  '삼두':'프레스 다운,라잉 트라이셉스 익스텐션,오버헤드 트라이셉스 익스텐션,킥백,딥스',
  '복부':'레그 레이즈,인클라인 레그 레이즈,크런치,리버스 크런치,트위스트 크런치,데드버그,할로우 데드버그,할로우바디 킥,플랭크',
  '옆구리':'사이드 플랭크,사이드 플랭크 레이즈,사이드 플랭크 에이비덕션,사이드 밴드,케이블 사이드밴딩,케이블 우드춉,레그 트위스트,라잉 레그 트위스트,레그레이즈 트위스트,러시안 트위스트',
  '스트레칭':'스트레칭,st,st+pnf,st+흉추,흉추 회전 스트레칭,다리찢기,90-90 스트레칭,월드 그레이티스트 스트레칭,종아리 스트레칭',
  '기능성':'파머스 캐리,슈트케이스 캐리,오버헤드 캐리,원암 오버헤드 캐리,숄더 캐리 워킹,클린 캐리,보수 걷기,보수 스텝,오버헤드 원레그 밸런스,걷기 분석,고관절 외전굴곡,런지 트위스트,케이블 로우 런지',
  '전신코어':'버드독,하이플랭크 버드독,베어홀드,플랭크 스텝,하이플랭크 홉,마운틴 클라이머'
};
function defaultCatalog(){
  const out=[];
  for(const p in CATALOG_SRC) for(const n of CATALOG_SRC[p].split(',')) out.push({name:n.trim(),part:p});
  return out;
}

/* =========================================================
   유틸
   ========================================================= */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
const addDays = (s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const addMonths = (s,n)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+n);return ymd(d);};
const daysBetween = (a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const fmtNum = n => Math.round(+n||0).toLocaleString('ko-KR');
const fmt1 = n => (Math.round((+n||0)*10)/10).toLocaleString('ko-KR');
const normKey = s => String(s||'').toLowerCase().replace(/\s+/g,'');
const fmtDate = s => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?`${m[1]}.${+m[2]}.${+m[3]}`:(s||''); };
const shortDate = s => { const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?`${+m[2]}.${+m[3]}`:(s||''); };
const fmtSec = s => { s=Math.round(+s||0); if(s<60) return s+'초'; const m=Math.floor(s/60), r=s%60; return r?`${m}분 ${r}초`:`${m}분`; };
const clone = o => JSON.parse(JSON.stringify(o));
const isOther = p => OTHER_PARTS.includes(p);
const partChip = p => p?`<span class="chip ${isOther(p)?'other':''}">${esc(p)}</span>`:`<span class="chip none">미분류</span>`;
const pctChange = (cur,prev)=> prev>0 ? Math.round((cur-prev)/prev*100) : null;
const signed = n => (n>0?'+':'')+n;
function store(key,val){ try{ if(val===undefined) return localStorage.getItem(key); if(val===null) localStorage.removeItem(key); else localStorage.setItem(key,val);}catch(e){ return null; } }

/* =========================================================
   저장소 (구글 시트 / 이 기기)
   ========================================================= */
const IS_GAS = typeof google!=='undefined' && google.script && google.script.run;
const LOCAL_KEY='ptlog_db_v1';
let DB = {members:[],sessions:[],inbody:[],assessments:[],catalog:[],settings:{}};

function gasCall(fn,...args){
  return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
function persistLocal(){ store(LOCAL_KEY, JSON.stringify(DB)); }

const API = {};
['saveMember','deleteMember','saveSession','deleteSession','renumberSessions','saveInbody','deleteInbody','saveAssessment','deleteAssessment','saveCatalog','saveSettings','renameExercise'].forEach(fn=>{
  API[fn] = async (...args)=>{
    setSaveState('saving');
    try{
      if(IS_GAS) await gasCall(fn,...args); else persistLocal();
      setSaveState('ok');
    }catch(e){
      setSaveState('err');
      toast('저장하지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.','err');
      throw e;
    }
  };
});
API.loadAll = async ()=>{
  if(IS_GAS){
    const d = await gasCall('loadAll');
    return normalizeLoaded(d);
  }
  let d=null; try{ d=JSON.parse(store(LOCAL_KEY)||'null'); }catch(e){}
  return normalizeLoaded(d||{});
};
function normalizeLoaded(d){
  const n = v => v===''||v==null ? '' : (isNaN(+v)? '' : +v);
  const out = {
    members:(d.members||[]).map(m=>Object.assign({},m,{regCount:n(m.regCount)})),
    sessions:(d.sessions||[]).map(s=>Object.assign({},s,{no:n(s.no),exercises:(s.exercises||[]).map(ex=>Object.assign({},ex,{sets:(ex.sets||[]).map(st=>Object.assign({},st,{kg:+st.kg||0,band:st.band===true||st.band==='1'||st.band==='true',mode:st.mode==='time'?'time':'reps'}))}))})),
    inbody:(d.inbody||[]).map(r=>{const o=Object.assign({},r); INBODY.forEach(f=>o[f.k]=n(r[f.k])); return o;}),
    assessments:(d.assessments||[]).map(a=>Object.assign({},a,{items:typeof a.items==='string'?safeJSON(a.items,{}):(a.items||{})})),
    catalog:d.catalog||[],
    settings:d.settings||{}
  };
  return out;
}
function safeJSON(s,f){ try{return JSON.parse(s);}catch(e){return f;} }

let saveTimer=null;
function setSaveState(st){
  const el=$('#saveState'); if(!el) return;
  clearTimeout(saveTimer);

  el.textContent = st==='saving'?'저장 중…':st==='ok'?'저장됨':st==='err'?'저장 실패':'';
  if(st==='ok') saveTimer=setTimeout(()=>{el.textContent='';},2000);

/* =========================================================
   계산
   ========================================================= */
function bands(){ return (DB.settings.bands&&DB.settings.bands.length)?DB.settings.bands:DEFAULT_BANDS; }
function tests(){ return (DB.settings.tests&&DB.settings.tests.length)?DB.settings.tests:DEFAULT_TESTS; }
function parseWeight(t){
  t=String(t==null?'':t).trim();
  if(!t) return {kg:0,band:false,kind:'none'};
  const bl=bands();
  const lv=/밴드\s*(\d+)/.exec(t);
  if(lv){ const b=bl.find(b=>+b.lv===+lv[1]); if(b) return {kg:+b.kg,band:true,kind:'band',label:b.color}; }
  for(const b of bl) if(t.includes(b.color)) return {kg:+b.kg,band:true,kind:'band',label:b.color};
  const m=/^(\d+(?:\.\d+)?)/.exec(t.replace(',','.'));
  if(m) return {kg:parseFloat(m[1]),band:false,kind:'kg'};
  return {kg:0,band:false,kind:'text'};
}
function setCalc(st){
  const has = st.kg!==undefined && st.kg!==null && st.kg!=='';
  const p = has?{kg:+st.kg||0,band:!!st.band,kind:(+st.kg>0?(st.band?'band':'kg'):(String(st.w||'').trim()?'text':'none'))}:parseWeight(st.w);
  if(st.mode==='time'){ const sec=+st.sec||0; return {kg:p.kg,band:p.band,kind:p.kind,vol:0,reps:0,bodyReps:0,sec}; }
  const reps=+st.reps||0;
  return {kg:p.kg,band:p.band,kind:p.kind,vol:p.kg*reps,reps,bodyReps:p.kg>0?0:reps,sec:0};
}
function setFilled(st){ return String(st.w||'').trim()!=='' || (+st.reps>0) || (+st.sec>0); }
function exStats(ex){
  let vol=0,bodyReps=0,sec=0,maxKg=0,e1rm=0;
  for(const st of ex.sets){
    const r=setCalc(st); vol+=r.vol; bodyReps+=r.bodyReps; sec+=r.sec;
    if(st.mode!=='time' && !r.band && r.kg>0 && r.reps>0){
      maxKg=Math.max(maxKg,r.kg);
      if(r.reps<=12) e1rm=Math.max(e1rm, r.reps===1?r.kg:r.kg*(1+r.reps/30));
    }
  }
  return {vol,bodyReps,sec,maxKg,e1rm};
}
function sessionStats(s){
  let vol=0,bodyReps=0,sec=0; const parts={};
  for(const ex of s.exercises){ const e=exStats(ex); vol+=e.vol; bodyReps+=e.bodyReps; sec+=e.sec; const p=ex.part||'미분류'; parts[p]=(parts[p]||0)+e.vol; }
  return {vol,bodyReps,sec,parts};
}
function weightLabel(st){
  const w=String(st.w||'').trim(); if(!w) return '';
  return /^\d+(\.\d+)?$/.test(w)? w+'kg' : w;
}
function setsSummary(sets){
  const fs=sets.filter(setFilled); if(!fs.length) return '';
  const allReps = fs.every(s=>s.mode!=='time'), allTime = fs.every(s=>s.mode==='time');
  const ws = fs.map(weightLabel), same = ws.every(w=>w===ws[0]);
  if(same && allReps) return (ws[0]?ws[0]+' × ':'')+fs.map(s=>s.reps||'-').join(' / ')+(ws[0]?'':'회');
  if(same && allTime) return (ws[0]?ws[0]+' · ':'')+fs.map(s=>fmtSec(s.sec)).join(' / ');
  return fs.map(s=>{const w=weightLabel(s); return s.mode==='time'?(w?w+' ':'')+fmtSec(s.sec):(w?w+'×':'')+(s.reps||'-')+(w?'':'회');}).join(' / ');
}
function memberSessions(mid){
  return DB.sessions.filter(s=>s.memberId===mid).sort((a,b)=>b.date.localeCompare(a.date)||(+b.no||0)-(+a.no||0));
}
function nextNo(mid){ let mx=0; for(const s of DB.sessions) if(s.memberId===mid) mx=Math.max(mx,+s.no||0); return mx+1; }
function catalogFind(name){ const k=normKey(name); if(!k) return null; return DB.catalog.find(c=>normKey(c.name)===k)||null; }
function exHistory(mid,name,excludeId){
  const k=normKey(name); const out=[];
  if(!k) return out;
  for(const s of memberSessions(mid)){ if(s.id===excludeId) continue; for(const ex of s.exercises) if(normKey(ex.name)===k) out.push({s,ex}); }
  return out;
}
function memberExercises(mid){
  const map=new Map();
  for(const s of memberSessions(mid)) for(const ex of s.exercises){
    const k=normKey(ex.name); if(!k) continue;
    if(!map.has(k)) map.set(k,{name:ex.name,part:ex.part,count:0,last:s.date});
    map.get(k).count++;
  }
  return Array.from(map.values());
}

function showAC(i,kind){
  const d=getDraft(); const ex=d.exercises[i];

  }

/* 세션 저장 */
async function commitSession(){
  const d=getDraft(); const m=member();
  const exs=d.exercises.filter(ex=>String(ex.name).trim()).map(ex=>({
    name:String(ex.name).trim(), note:String(ex.note||'').trim(), part:ex.part||'',
    sets:ex.sets.filter(setFilled).map(st=>{const p=('kg' in st && st.kg!=='' && st.kg!=null)?{kg:+st.kg,band:!!st.band}:parseWeight(st.w); return {w:String(st.w||'').trim(),kg:p.kg,band:p.band,mode:st.mode,reps:st.mode==='time'?'':(st.reps===''?'':+st.reps),sec:st.mode==='time'?(st.sec===''?'':+st.sec):''};})
  }));
  if(!exs.length){ toast('운동을 하나 이상 입력하세요.','err'); return; }
  if(!d.date){ toast('날짜를 입력하세요.','err'); return; }
  const missing=exs.filter(e=>!e.part).map(e=>e.name);
  const sess={id:d.id||uid(),memberId:m.id,date:d.date,no:+d.no||nextNo(m.id),memo:String(d.memo||'').trim(),exercises:exs,updatedAt:new Date().toISOString()};
  // 운동 목록 갱신
  let catChanged=false;
  for(const e of exs){ if(!e.part) continue; const c=catalogFind(e.name); if(!c){ DB.catalog.push({name:e.name,part:e.part}); catChanged=true; } else if(c.part!==e.part){ c.part=e.part; catChanged=true; } }
  const idx=DB.sessions.findIndex(s=>s.id===sess.id);
  if(idx>=0) DB.sessions[idx]=sess; else DB.sessions.push(sess);
  try{
    await API.saveSession(sess);
    if(catChanged) await API.saveCatalog(DB.catalog);
  }catch(e){ return; }
  // 저장 후: 수정 모드로 유지
  const nd=clone(sess); nd.dirty=false;
  nd.exercises.forEach(ex=>{ ex.partManual=!!ex.part; });
  state.drafts[m.id]=nd; store(draftKey(m.id),null);
  toast(missing.length?`저장했습니다. 부위 미분류: ${missing.join(', ')}`:'저장했습니다.');
  render();
}

/* ---------- 타이머 ---------- */
const timer={i:null,j:null,target:30,elapsed:0,running:false,start:0,raf:null,done:false,ctx:null};
function openTimer(i,j){
  const d=getDraft(); const ex=d.exercises[i]; const st=ex.sets[j];
  stopTimerLoop();
  Object.assign(timer,{i,j,target:(+st.sec>0?+st.sec:(timer.target||30)),elapsed:0,running:false,done:false});
  renderTimer();
}
function renderTimer(){
  let el=$('#timer');
  if(timer.i===null){ if(el) el.remove(); return; }
  const d=getDraft(); const ex=d.exercises[timer.i];
  if(!el){ el=document.createElement('div'); el.id='timer'; el.className='timer'; document.body.appendChild(el); }
  const presets=[20,30,45,60,90];
  el.innerHTML=`<div class="tt"><div><b>${esc(ex&&ex.name||'운동')}</b>${timer.j+1}세트 · ${timer.target>0?'카운트다운':'스톱워치'}</div><button class="icon-btn" data-act="timerClose" aria-label="타이머 닫기">✕</button></div>
    <div class="clock" id="tClock">0</div><div class="bar"><i id="tBar"></i></div>
    <div class="presets">${presets.map(p=>`<button class="${timer.target===p?'on':''}" data-act="timerPreset" data-v="${p}">${p}초</button>`).join('')}<button class="${timer.target===0?'on':''}" data-act="timerPreset" data-v="0">∞</button></div>
    <div class="tbtns"><button class="btn primary" data-act="timerToggle" id="tToggle">${timer.running?'일시정지':(timer.elapsed>0&&!timer.done?'계속':'시작')}</button><button class="btn" data-act="timerReset">초기화</button>
    <button class="btn" data-act="timerSave" style="grid-column:1/-1">기록하고 닫기</button></div>`;
  paintTimer();
}
function timerElapsed(){ return timer.running? timer.elapsed+(performance.now()-timer.start)/1000 : timer.elapsed; }
function paintTimer(){
  const c=$('#tClock'), b=$('#tBar'); if(!c) return;
  const e=timerElapsed();
  if(timer.target>0){
    const left=Math.max(0,timer.target-e);
    c.textContent=Math.ceil(left-1e-9);
    b.style.width=Math.min(100,e/timer.target*100)+'%';
    if(left<=0 && timer.running){ timer.elapsed=timer.target; timer.running=false; timer.done=true; stopTimerLoop(); beep(3); try{navigator.vibrate&&navigator.vibrate([250,120,250]);}catch(err){} fillTimerSec(timer.target); renderTimer(); return; }
  }else{ c.textContent=Math.floor(e); b.style.width='0%'; }
  c.className='clock'+(timer.done?' done':timer.running?' run':'');
}
function loop(){ paintTimer(); if(timer.running) timer.raf=requestAnimationFrame(loop); }
function stopTimerLoop(){ if(timer.raf) cancelAnimationFrame(timer.raf); timer.raf=null; }
function beep(n){
  try{
    const ctx=timer.ctx||(timer.ctx=new (window.AudioContext||window.webkitAudioContext)());
    for(let k=0;k<n;k++){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=880; o.connect(g); g.connect(ctx.destination); const t=ctx.currentTime+k*0.32; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22); o.start(t); o.stop(t+0.24); }
  }catch(e){}
}
function fillTimerSec(sec){
  const d=getDraft(); const ex=d.exercises[timer.i]; if(!ex||!ex.sets[timer.j]) return;
  ex.sets[timer.j].sec=String(Math.round(sec)); markDirty();
  const inp=$(`[data-f="sec"][data-ex="${timer.i}"][data-set="${timer.j}"]`); if(inp) inp.value=ex.sets[timer.j].sec;
  const sv=$(`#sv-${timer.i}-${timer.j}`); if(sv) sv.innerHTML=setVolHTML(ex.sets[timer.j]);
  const cv=$('#cv-'+timer.i); if(cv) cv.innerHTML=exVolHTML(exStats(ex));
  updateTotals();
}

/* ---------- 차트 (SVG) ---------- */
function niceMax(v){ if(!(v>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function compact(n){ n=+n||0; if(Math.abs(n)>=10000) return (Math.round(n/1000)/10)+'만'; return fmtNum(n); }
function svgBars(items,opt={}){
  if(!items.length) return `<div class="empty">표시할 기록이 없습니다.</div>`;
  const W=opt.w||680,H=opt.h||230,pl=46,pr=10,pt=20,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  const mx=niceMax(Math.max(...items.map(d=>d.value)));
  const bw=iw/items.length, barW=Math.max(3,Math.min(44,bw*0.62));
  const step=Math.ceil(items.length/Math.max(1,Math.floor(iw/56)));
  const fmt=opt.fmt||compact;
  let g='';
  for(let k=0;k<=4;k++){ const y=pt+ih-ih*k/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e6e9ee" stroke-width="1"/><text x="${pl-8}" y="${y+4}" font-size="11" fill="#8a93a3" text-anchor="end">${fmt(mx*k/4)}</text>`; }
  items.forEach((d,k)=>{
    const x=pl+bw*k+(bw-barW)/2, h=ih*(d.value/mx), y=pt+ih-h;
    g+=`<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(0,h)}" rx="3" fill="${opt.color||'#1f3a5f'}"><title>${esc(d.label)}: ${fmt(d.value)}</title></rect>`;
    if(items.length<=14 && d.value>0) g+=`<text x="${x+barW/2}" y="${y-5}" font-size="11" fill="#556070" text-anchor="middle">${fmt(d.value)}</text>`;
    if(k%step===0) g+=`<text x="${x+barW/2}" y="${H-12}" font-size="11.5" fill="#556070" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||'막대 그래프')}">${g}</svg>`;
}
function svgLines(labels,series,opt={}){
  if(!labels.length) return `<div class="empty">표시할 기록이 없습니다.</div>`;
  const W=opt.w||680,H=opt.h||240,pl=46,pr=16,pt=22,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  const vals=series.flatMap(s=>s.values.filter(v=>v!=null));
  let lo=opt.zero?0:Math.min(...vals), hi=Math.max(...vals);
  if(!opt.zero){ const span=(hi-lo)||Math.max(1,hi*0.1); lo=Math.max(0,lo-span*0.25); hi=hi+span*0.25; } else hi=niceMax(hi);
  const xs=k=>labels.length===1?pl+iw/2:pl+iw*k/(labels.length-1);
  const ys=v=>pt+ih-ih*(v-lo)/((hi-lo)||1);
  const fmt=opt.fmt||((hi-lo)>=20?(v=>fmtNum(v)):(hi-lo)>=4?(v=>fmt1(v)):(v=>(Math.round(v*100)/100).toLocaleString('ko-KR')));
  let g='';
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, y=ys(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#e6e9ee"/><text x="${pl-8}" y="${y+4}" font-size="11" fill="#8a93a3" text-anchor="end">${fmt(v)}</text>`; }
  const step=Math.ceil(labels.length/10);
  labels.forEach((l,k)=>{ if(k%step===0||k===labels.length-1) g+=`<text x="${xs(k)}" y="${H-12}" font-size="11.5" fill="#556070" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s=>{
    const pts=s.values.map((v,k)=>v==null?null:[xs(k),ys(v)]).filter(Boolean);
    if(pts.length>1) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" ${s.dash?'stroke-dasharray="6 5"':''} points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
    s.values.forEach((v,k)=>{ if(v==null) return; g+=`<circle cx="${xs(k)}" cy="${ys(v)}" r="4" fill="#fff" stroke="${s.color}" stroke-width="2.2"><title>${esc(labels[k])} ${esc(s.name)}: ${fmt(v)}</title></circle>`;
      if(labels.length<=10 && !s.dash) g+=`<text x="${xs(k)}" y="${ys(v)-10}" font-size="11" fill="${s.color}" text-anchor="middle" font-weight="700">${fmt(v)}</text>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||'선 그래프')}">${g}</svg>`;
}

/* ---------- 변화 추이 ---------- */
function trendRange(){
  const t=state.trend, end=today();
  if(t.preset==='custom') return {from:t.from||addMonths(end,-1),to:t.to||end};
  if(t.preset==='all'){ const ss=memberSessions(state.memberId); return {from:ss.length?ss[ss.length-1].date:end,to:end,all:true}; }
  const n={'1m':1,'3m':3,'6m':6}[t.preset]||3;
  return {from:addDays(addMonths(end,-n),1),to:end};
}
function inRange(s,r){ return s.date>=r.from && s.date<=r.to; }
function viewTrend(){
  const m=member(); const r=trendRange(); const t=state.trend;
  const ss=memberSessions(m.id).filter(s=>inRange(s,r)).reverse();
  const len=daysBetween(r.from,r.to)+1; const prev={from:addDays(r.from,-len),to:addDays(r.from,-1)};
  const ps=r.all?[]:memberSessions(m.id).filter(s=>inRange(s,prev));
  const sum=(arr)=>arr.reduce((a,s)=>{const st=sessionStats(s); a.vol+=st.vol; a.reps+=st.bodyReps; a.sec+=st.sec; for(const p in st.parts) a.parts[p]=(a.parts[p]||0)+st.parts[p]; return a;},{vol:0,reps:0,sec:0,parts:{}});
  const cur=sum(ss), pv=sum(ps);
  const ch=pctChange(cur.vol,pv.vol);
  // 월별
  const months={}; ss.forEach(s=>{const k=s.date.slice(0,7); months[k]=(months[k]||0)+sessionStats(s).vol;});
  // 부위
  const partKeys=ALL_PARTS.concat(['미분류']).filter(p=>(cur.parts[p]||0)>0||(pv.parts[p]||0)>0);
  const pmax=Math.max(1,...partKeys.map(p=>Math.max(cur.parts[p]||0,pv.parts[p]||0)));
  // 운동별
  const exOpts=memberExercises(m.id).filter(e=>exHistory(m.id,e.name).some(h=>exStats(h.ex).maxKg>0)).sort((a,b)=>b.count-a.count);
  if(!t.ex && exOpts[0]) t.ex=exOpts[0].name;
  let exChart='';
  if(t.ex){
    const hs=exHistory(m.id,t.ex).filter(h=>inRange(h.s,r)).reverse().map(h=>({h,e:exStats(h.ex)})).filter(x=>x.e.maxKg>0);
    exChart = hs.length? `<div class="legend"><span><i style="background:#1f3a5f"></i>최고 무게</span><span><i style="background:#9a7b3c"></i>1RM 추정</span></div>`+svgLines(hs.map(x=>shortDate(x.h.s.date)),[{name:'최고 무게',color:'#1f3a5f',values:hs.map(x=>x.e.maxKg)},{name:'1RM 추정',color:'#9a7b3c',dash:true,values:hs.map(x=>x.e.e1rm||null)}],{title:'운동별 무게 변화'})
      :`<div class="empty">이 기간에 무게(kg)를 기록한 세트가 없습니다. 밴드·맨몸 세트는 제외됩니다.</div>`;
  }
  return `<div class="stack">
    <div class="card card-pad"><div class="row">
      <div class="seg-chips">${[['1m','1개월'],['3m','3개월'],['6m','6개월'],['all','전체'],['custom','직접 지정']].map(([k,l])=>`<button class="${t.preset===k?'on':''}" data-act="trendPreset" data-v="${k}">${l}</button>`).join('')}</div>
      ${t.preset==='custom'?`<input type="date" class="input" style="width:170px" data-bind="trendFrom" value="${r.from}"><span>~</span><input type="date" class="input" style="width:170px" data-bind="trendTo" value="${r.to}">`:`<span class="muted num">${fmtDate(r.from)} ~ ${fmtDate(r.to)}</span>`}
    </div></div>
    <div class="stat-row">
      <div class="stat"><small>수업 횟수</small><b class="num">${ss.length}회</b>${r.all?'':`<span class="faint"> 직전 ${ps.length}회</span>`}</div>
      <div class="stat"><small>총 운동볼륨</small><b class="num">${fmtNum(cur.vol)}kg</b><br>${ch==null?`<span class="faint">직전 기간 기록 없음</span>`:`<span class="${ch>=0?'up':'down'}">직전 기간 대비 ${signed(ch)}%</span>`}</div>
      <div class="stat"><small>맨몸·기타 횟수</small><b class="num">${fmtNum(cur.reps)}회</b></div>
      <div class="stat"><small>시간 세트 합계</small><b class="num">${fmtSec(cur.sec)}</b></div>
    </div>
    <div class="card card-pad"><div class="section-title"><h3>수업별 총 운동볼륨 (kg)</h3></div>${svgBars(ss.map(s=>({label:shortDate(s.date),value:sessionStats(s).vol})),{title:'수업별 총 운동볼륨'})}</div>
    <div class="grid2">
      <div class="card card-pad"><div class="section-title"><h3>월별 운동볼륨 (kg)</h3></div>${svgBars(Object.keys(months).sort().map(k=>({label:k.slice(2).replace('-','.'),value:months[k]})),{h:230,w:440,title:'월별 운동볼륨'})}</div>
      <div class="card card-pad"><div class="section-title"><h3>부위별 운동볼륨</h3>${r.all?'':`<span class="legend" style="margin:0"><span><i style="background:#1f3a5f"></i>이번 기간</span><span><i style="background:#c3ccd9"></i>직전 기간</span></span>`}</div>
        ${partKeys.length?`<div class="hbars">${partKeys.map(p=>{const c=cur.parts[p]||0, v=pv.parts[p]||0, pc=pctChange(c,v);return `<div class="hbar"><span>${esc(p)}</span><span class="track"><i style="width:${c/pmax*100}%"></i>${r.all?'':`<i class="prev" style="width:${v/pmax*100}%"></i>`}</span><span class="val num">${compact(c)}${r.all||pc==null?'':`<small class="${pc>=0?'up':'down'}">${signed(pc)}%</small>`}</span></div>`;}).join('')}</div>`:`<div class="empty">무게가 있는 세트가 없습니다.</div>`}
      </div>
    </div>
    <div class="card card-pad"><div class="section-title"><h3>운동별 무게 변화</h3>
      <select class="input" data-bind="trendEx" style="max-width:300px">${exOpts.length?exOpts.map(e=>`<option ${normKey(e.name)===normKey(t.ex)?'selected':''} value="${esc(e.name)}">${esc(e.name)}</option>`).join(''):'<option>무게 기록이 있는 운동 없음</option>'}</select></div>
      ${exChart||'<div class="empty">무게 기록이 있는 운동이 없습니다.</div>'}
      <p class="faint" style="font-size:12.5px;margin:8px 0 0">1RM 추정: Epley 공식, kg 무게로 1~12회 한 세트만 계산 (밴드·맨몸 제외)</p></div>
    <div class="grid2">
      <div class="card card-pad"><div class="section-title"><h3>수업별 맨몸·기타 횟수</h3></div>${svgBars(ss.map(s=>({label:shortDate(s.date),value:sessionStats(s).bodyReps})),{h:210,w:440,color:'#5f7fa8',fmt:v=>fmtNum(v)})}</div>
      <div class="card card-pad"><div class="section-title"><h3>수업별 시간 세트 합계 (초)</h3></div>${svgBars(ss.map(s=>({label:shortDate(s.date),value:sessionStats(s).sec})),{h:210,w:440,color:'#9a7b3c',fmt:v=>fmtNum(v)})}</div>
    </div>
  </div>`;
}

function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function wrapLines(g,text,maxW){
  const out=[]; String(text||'').split('\n').forEach(par=>{ let line=''; for(const ch of par){ const t=line+ch; if(g.measureText(t).width>maxW && line){ const sp=line.lastIndexOf(' '); if(sp>line.length*0.6){ out.push(line.slice(0,sp)); line=line.slice(sp+1)+ch; } else { out.push(line); line=ch; } } else line=t; } out.push(line); });
  return out;
}
function buildReportCanvas(){
  const m=member(); const rp=state.report;

  const r={from,to};

  const ps=memberSessions(m.id).filter(s=>inRange(s,prev));

  const ib=memberInbody(m.id).filter(x=>x.date>=from&&x.date<=to);

  const c=document.createElement('canvas'); c.width=W; c.height=4200; const g=c.getContext('2d');
  const NAVY='#1f3a5f', INK='#1b2230', INK2='#556070', INK3='#8a93a3', LINE='#e2e5ea', SOFT='#f4f6f9', GOLD='#9a7b3c';
  g.fillStyle='#f4f5f7'; g.fillRect(0,0,W,c.height);
  // header
  g.fillStyle=NAVY; g.fillRect(0,0,W,250);
  g.fillStyle='rgba(255,255,255,.7)'; g.font=`600 26px ${F}`; g.fillText('PT 운동 리포트',P,78);
  g.fillStyle='#fff'; g.font=`800 58px ${F}`; g.fillText(`${m.name} 회원님`,P,154);
  g.fillStyle='rgba(255,255,255,.85)'; g.font=`500 28px ${F}`; g.fillText(`${fmtDate(from)} ~ ${fmtDate(to)}`,P,206);
  let y=290;
  const card=(x,yy,w,h)=>{ g.fillStyle='#fff'; rr(g,x,yy,w,h,22); g.fill(); g.strokeStyle=LINE; g.lineWidth=1.5; g.stroke(); };
  // stats
  const cw=(W-2*P-2*20)/3;
  const stats=[['수업 횟수',`${ss.length}회`,''],['총 운동볼륨',`${fmtNum(cur.vol)}kg`,''],['직전 같은 기간 대비',ch==null?'—':`${signed(ch)}%`,ch==null?'비교할 기록 없음':`직전 ${fmtNum(pv.vol)}kg`]];
  stats.forEach((s,k)=>{ const x=P+k*(cw+20); card(x,y,cw,160); g.fillStyle=INK3; g.font=`600 23px ${F}`; g.fillText(s[0],x+26,y+46); g.fillStyle=k===2&&ch!=null?(ch>=0?'#2d6a4f':'#a5492a'):NAVY; g.font=`800 44px ${F}`; g.fillText(s[1],x+26,y+106); if(s[2]){ g.fillStyle=INK3; g.font=`500 20px ${F}`; g.fillText(s[2],x+26,y+140);} });
  y+=200;
  const section=(title,h)=>{ card(P,y,W-2*P,h); g.fillStyle=INK; g.font=`700 30px ${F}`; g.fillText(title,P+30,y+56); return y+86; };
  // session volume chart
  {
    const h=420; const top=section('수업별 운동볼륨',h);
    const x0=P+90, x1=W-P-30, y0=top+10, y1=y+h-60; const iw=x1-x0, ih=y1-y0;
    if(!ss.length){ g.fillStyle=INK3; g.font=`500 24px ${F}`; g.fillText('이 기간에 수업 기록이 없습니다.',P+30,top+60); }

      for(let k=0;k<=4;k++){ const yy=y1-ih*k/4; g.strokeStyle='#eceef2'; g.lineWidth=1; g.beginPath(); g.moveTo(x0,yy); g.lineTo(x1,yy); g.stroke(); g.fillStyle=INK3; g.fillText(compact(mx*k/4),x0-12,yy+6); }
      const bw=iw/vals.length, barW=Math.max(6,Math.min(56,bw*0.6)); const step=Math.ceil(vals.length/10);
      g.textAlign='center';
      vals.forEach((v,k)=>{ const bx=x0+bw*k+(bw-barW)/2, bh=ih*v/mx; g.fillStyle=NAVY; rr(g,bx,y1-bh,barW,Math.max(bh,0.1),Math.min(6,barW/2)); g.fill();
        if(vals.length<=12&&v>0){ g.fillStyle=INK2; g.font=`600 17px ${F}`; g.fillText(compact(v),bx+barW/2,y1-bh-10); }
        if(k%step===0){ g.fillStyle=INK2; g.font=`500 18px ${F}`; g.fillText(shortDate(ss[k].date),bx+barW/2,y1+32); } });
      g.textAlign='left';
    }
    y+=h+28;
  }
  // parts
  {
    const keys=ALL_PARTS.concat(['미분류']).filter(p=>(cur.parts[p]||0)>0);
    const extra=(cur.reps>0||cur.sec>0)?1:0;

    if(extra){ const yy=top+Math.max(1,keys.length)*58+10; g.fillStyle=INK2; g.font=`500 22px ${F}`; g.fillText(`무게 없는 운동  ·  횟수 ${fmtNum(cur.reps)}회   ·   시간 ${fmtSec(cur.sec)}`,P+30,yy+24); }

  // inbody: 기간 직전 마지막 측정(없으면 기간 첫 측정)과 기간 마지막 측정 비교

    const h=106+(rows.length?60+rows.length*60:50)+10;
    const top=section('인바디 변화',h);
    if(!rows.length){ g.fillStyle=INK3; g.font=`500 24px ${F}`; g.fillText('이 기간에 측정 기록이 없습니다.',P+30,top+30); }

      rows.forEach((o,k)=>{ const yy=top+60+k*60; const f=o.f, a=o.base[f.k], b=o.last[f.k], dv=Math.round((b-a)*10)/10;
        g.strokeStyle='#eceef2'; g.beginPath(); g.moveTo(P+30,yy-36); g.lineTo(W-P-30,yy-36); g.stroke();
        g.fillStyle=INK; g.font=`600 24px ${F}`; g.fillText(f.l,cx[0],yy);
        g.font=`500 24px ${F}`;

        else{ g.fillText(fmt1(a)+f.u,cx[1],yy); g.fillText(fmt1(b)+f.u,cx[2],yy); }
        g.fillStyle=INK3; g.font=`500 17px ${F}`;

async function renameEverywhere(fromName, finalName, part){
  const k=normKey(fromName);
  for(const s of DB.sessions) for(const ex of s.exercises) if(normKey(ex.name)===k){ ex.name=finalName; ex.part=part; }
  try{ await API.renameExercise(fromName,finalName,part); await API.saveCatalog(DB.catalog); }catch(e){}
}

  if(!b) return;
  if(b==='histEx'){ state.hist.ex=t.value; renderTab(); }
  else if(b==='trendEx'){ state.trend.ex=t.value; renderTab(); }
  else if(b==='trendFrom'){ state.trend.from=t.value; renderTab(); }
  else if(b==='trendTo'){ state.trend.to=t.value; renderTab(); }
  else if(b==='evalDate'){ state.evalEdit.date=t.value; }
  else if(b==='cmpA'){ state.cmp.a=t.value; renderTab(); }
  else if(b==='cmpB'){ state.cmp.b=t.value; renderTab(); }
  else if(b==='repFrom'){ state.report.from=t.value; drawReportPreview(); }
  else if(b==='repTo'){ state.report.to=t.value; drawReportPreview(); }
  else if(b==='catPart'){ DB.catalog[+t.dataset.idx].part=t.value; try{ await API.saveCatalog(DB.catalog);}catch(err){} }
});
window.addEventListener('beforeunload',e=>{ const d=state.memberId&&state.drafts[state.memberId]; if(d&&d.dirty){ const c=clone(d); delete c.restored; store(draftKey(d.memberId),JSON.stringify(c)); } });

/* =========================================================

function ensureDefaults(){
  let changed=false;
  if(!DB.catalog.length){ DB.catalog=defaultCatalog(); changed=true; }
  if(!DB.settings.bands){ DB.settings.bands=clone(DEFAULT_BANDS); changed=true; }
  if(!DB.settings.tests){ DB.settings.tests=DEFAULT_TESTS.slice(); changed=true; }
  return changed;
}
async function init(){
  const pill=$('#modePill');
  pill.textContent=IS_GAS?'구글 시트 연결':'테스트 모드 · 이 기기에만 저장'; pill.className='mode-pill'+(IS_GAS?' gas':'');
  try{ DB=await API.loadAll(); }
  catch(e){ $('#app').innerHTML=`<div class="card empty">기록을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.<br><small>${esc(e&&e.message||e)}</small></div>`; return; }
  // 테스트 모드(파일로 직접 연 경우)에서 회원이 하나도 없으면 테스트 회원 데이터를 넣어 둡니다.
  if(!IS_GAS && !DB.members.length && !store('ptlog_sample_done')){ ensureDefaults(); addSample(); persistLocal(); store('ptlog_sample_done','1'); }
  if(ensureDefaults()){ try{ if(IS_GAS){ await gasCall('saveCatalog',DB.catalog); await gasCall('saveSettings',DB.settings); } else persistLocal(); }catch(e){} }
  render();
}
init();
